name: CI

# Only checks that depend on this repository alone. The cross-repository
# checks (release catalogs, course pack, browser transfer) follow other
# repositories' main branches; run them locally with scripts/test.sh.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

  smoke:
    name: smoke (Linux, Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Install Xvfb
        run: sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri >/dev/null
      - name: OpenGL, UI and export smoke
        run: scripts/test.sh smoke
