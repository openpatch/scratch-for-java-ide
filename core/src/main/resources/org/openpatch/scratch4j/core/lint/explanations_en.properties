compiler.err.expected=A statement or expression is incomplete here. Most often a semicolon (;), a closing bracket or a closing brace is missing on this or the line above.
compiler.err.premature.eof=The end of the file was reached while brackets or braces were still open. A closing brace } is probably missing.
compiler.err.cant.resolve.symbol=Java does not know this name. Check the spelling (Java is case-sensitive!) and make sure the variable, method or class exists and is spelled exactly like its declaration.
compiler.err.cant.resolve.location=Java cannot find this name at this place. Check the spelling (Java is case-sensitive!) and make sure the variable or class is declared before you use it.
compiler.err.prob.found.req=This value has the wrong type. Check what type the variable or parameter expects and what the expression actually returns.
compiler.err.missing.ret.stmt=This method promises to return a value, but there is a path through it that returns nothing. Add a return statement.
compiler.err.unreachable.stmt=This code can never run, because the code before it always exits (return, break or throw). Remove the unreachable code.
compiler.err.not.stmt=This line is not a complete Java statement. Very often a semicolon (;) is missing in the line above.
compiler.err.illegal.start.of.expr=Java cannot read this expression. A bracket, a quote or a semicolon is probably missing, misplaced, or not closed.
compiler.err.already.defined=A variable with this name already exists here. Give this one a different name.
compiler.err.class.public.should.be.in.file=A public class must live in a file with exactly the same name (Java is case-sensitive!). Rename the file or the class so both match.
compiler.err.cannot.apply.symbol=No method with this name accepts these arguments. Check the argument types, their order and their count.
compiler.err.abstract.cant.be.instantiated=You cannot create an object of an abstract class. Use a concrete subclass instead.
compiler.err.does.not.override.abstract=Your class does not implement all abstract methods. Add the missing method(s) or make your class abstract.
compiler.err.unreported.exception.need.to.catch=This call can throw an exception that you must handle. Surround it with a try/catch or add the exception to the method signature.
compiler.err.cant.apply.symbol=No method with this name accepts these arguments. Check the argument types, their order and their count.
compiler.err.cant.apply.symbols=No method with this name accepts these arguments. Check the argument types, their order and their count.
compiler.err.cant.resolve.location.args=Java does not know a method with this name here. Check the spelling (Java is case-sensitive!) - the "did you mean" suggestion shows similar names - and that the method belongs to this object.
compiler.err.cant.resolve.args=Java does not know a method with this name. Check the spelling (Java is case-sensitive!) and look at the suggestions.
compiler.err.var.might.not.have.been.initialized=This variable is used before it has a value. Give it a start value where you declare it, for example int score = 0;
compiler.err.else.without.if=This else has no matching if. Usually a ; right after if (...) or a missing { } is the reason.
compiler.err.illegal.start.of.type=Something is in a place where Java expects a declaration. Statements like method calls must be inside a method (for example inside run() or the constructor).
lint.forever=This loop never ends, so {0} never finishes and the program freezes.
lint.forever.explain=In Scratch, a forever block runs its blocks once per frame. In Scratch for Java, the library already calls run() about 60 times per second - put the loop body into run() (without the loop) and it repeats forever without freezing the window.
lint.longloop=This loop counts to {0} every frame - the program will stutter.
lint.longloop.explain=run() should finish quickly: the library calls it about 60 times per second and draws only after it returns. Spread long work over several frames, or do it once in the constructor.
lint.sleep={0} pauses the whole program, not just this sprite.
lint.sleep.explain=There is no wait block in Scratch for Java: sleeping stops the drawing and every other sprite. To do something every few milliseconds, use getTimer().everyMillis(500) inside run(); to wait once, compare getTimer().forMillis(...) or count frames.
lint.window.inside={0} creates a new Window. A program has exactly one window.
lint.window.inside.explain=The first Stage you create opens the window, and Window is a singleton. Switch stages with Window.getInstance().setStage(new Level2()) or transitionToStage(...) instead of creating another window.
lint.window.second=This creates a second window. A program has exactly one window.
lint.window.second.explain=Window is a singleton: create it once (or let the first Stage create it). To show another scene, switch the stage with Window.getInstance().setStage(...).
lint.static=Every {1} keeps its own {0}. Should all of them share it? Then make it static.
lint.static.explain=In Scratch, a variable "for all sprites" is shared. In Java every object gets its own copy of a field - unless it is static: static int {0} = 0; is one value shared by all {1} objects.

# Friendly headlines for compiler errors (FriendlyErrors): friendly.<case>.title is the
# headline, friendly.<case> the explanation. {0}, {1}, ... are replaced literally.
friendly.token.semicolon=A semicolon ;
friendly.token.paren.close=A closing bracket )
friendly.token.paren.open=An opening bracket (
friendly.token.brace.close=A closing brace }
friendly.token.brace.open=An opening brace {
friendly.token.bracket.close=A closing square bracket ]
friendly.token.bracket.open=An opening square bracket [
friendly.token.comma=A comma ,
friendly.token.equals=An equals sign =
friendly.token.dot=A dot .
friendly.expected.title={0} is missing here
friendly.expected=Java noticed the gap at this spot. If you cannot see it here, look at the end of the line above: that is often where it is missing.
friendly.expected.name.title=A name is missing here
friendly.expected.name=Java expected the name of a variable, method or class at this spot. Often an instruction such as a method call stands outside a method, or the type before a name is missing.
friendly.eof.title=The file ends too early: a closing brace } is missing
friendly.eof=Every { needs a matching }. Check that each method and the class itself are closed.
friendly.outside.class.title=This code is outside of the class
friendly.outside.class=Everything must be inside the braces of the class. Often there is one } too many above this line, so the class ends too early.
friendly.unknown.variable.title=Java does not know a variable named {0}
friendly.unknown.variable=Check the spelling (Java is case-sensitive!) and that the variable is declared before this line, in the same { } block or as a field of the class.
friendly.unknown.method.title=Java does not know a method named {0}()
friendly.unknown.method=Check the spelling (Java is case-sensitive!) and that the method belongs to this object. The API help lists the methods of the library.
friendly.unknown.class.title=Java does not know a class named {0}
friendly.unknown.class=Check the spelling: class names start with a capital letter (String, Sprite). If it is a class of your project, its file must be named {0}.java.
friendly.import.title={0} needs an import
friendly.import=Add this line at the very top of the file: {1}
friendly.static.title={0} belongs to an object, but this code is static
friendly.static=A static method (like main) runs without an object, so it cannot use the fields and methods of one. Create an object with new and use it, or put this code into a method that is not static.
friendly.static.this.title=There is no "this" in a static method
friendly.static.this=A static method (like main) runs without an object. Create an object with new and use that one instead.
friendly.constructor.title=Is {0} meant to be the constructor? It must be named exactly {1}
friendly.constructor=A constructor has no return type and exactly the name of its class, including capital letters.
friendly.return.type.title=The method {0} has no return type
friendly.return.type=Write the type of the result before the name, or void if the method returns nothing: public void {0}()
friendly.override.title={0}() does not replace a method of the class it extends
friendly.override=@Override only fits methods that already exist in the parent class (for example Sprite or Stage), with exactly the same name and parameters. Check spelling and capital letters: run() is not Run().
friendly.operator.title={0} does not work with {1} and {2}
friendly.operator=Both sides of {0} must fit together, for example two numbers. Check what type the values on both sides have.
friendly.operator.text.title={0} does not work with {1} and {2}
friendly.operator.text=Text (String) cannot be calculated with or compared with < and >. Compare texts with equals, for example name.equals("Bob"). To use a number written as text, convert it first: Integer.parseInt(text).
friendly.return.void.title=This method is void, so it cannot return a value
friendly.return.void=Remove the value after return, or replace void with the type of the value, for example public int count().
friendly.return.missing.title=This method must return a value
friendly.return.missing=Write the value after return, for example return score;
friendly.lossy.title={0} does not fit into {1} without losing part of it
friendly.lossy=For example 2.7 would become 2. Make the variable a {0}, or convert on purpose by writing ({1}) before the value, for example ({1}) getX().
friendly.condition.title=A condition needs true or false, but this is {0}
friendly.condition=if and while need a yes-or-no question, for example x > 0 or name.equals("Bob").
friendly.assign.condition.title== stores a value. To compare, write ==
friendly.assign.condition=In a condition, x = 2 tries to store 2 in x. Compare numbers with x == 2 and texts with a.equals(b).
friendly.convert.text.title=Text cannot be used as {0}
friendly.convert.text=Even "42" is text, not a number. Convert it: Integer.parseInt(text) or Double.parseDouble(text).
friendly.convert.title={0} does not fit where {1} is needed
friendly.convert=Check the type of the variable or parameter, and what the expression gives you.
friendly.deref.title={0} is a plain value and has no methods
friendly.deref=Only objects have methods you call with a dot. int, double, boolean and char are plain values. To turn a number into text, use String.valueOf(x).
friendly.private.title={0} is private in {1}
friendly.private=Only code inside {1} may use it. Use a public method of {1}, or make it public if other classes should use it.
friendly.final.title={0} is final and cannot change
friendly.final=Remove final where {0} is declared if its value should change.
friendly.defined.title={0} already exists here
friendly.defined=Two variables or methods in the same place cannot have the same name. Rename one. To change an existing variable, leave out the type: x = 5; instead of int x = 5;
friendly.uninitialized.title={0} has no value yet
friendly.uninitialized=Give it a start value where you declare it, for example int {0} = 0;
friendly.arguments.title={0} needs ({1}) but gets ({2})
friendly.arguments=Check the number, the order and the types of the values in the brackets.
friendly.arguments.none=nothing
friendly.arguments.any.title=No version of this method fits these values
friendly.arguments.any=Check the number, the order and the types of the values in the brackets. The API help lists all versions.
friendly.unclosed.string.title=This text is missing its closing "
friendly.unclosed.string=A text starts and ends with a straight double quote ". It cannot continue on the next line.
friendly.unclosed.comment.title=This comment never ends: */ is missing
friendly.unclosed.comment=A comment that starts with /* ends with */. Everything in between is ignored, so Java does not see the rest of your code.
friendly.smart.quotes.title=Java needs straight quotes "
friendly.smart.quotes=Curly quotes come from word processors or websites. Type them again with the " key.
friendly.illegal.char.title=The character {0} does not belong in Java code
friendly.illegal.char=Remove it, or put it inside quotes if it is part of a text.
friendly.break.title=break only works inside a loop or switch
friendly.break=To leave a method early, use return.
friendly.else.title=This else has no matching if
friendly.else=Usually there is a ; right after if (...), or the braces { } around the if part are missing or misplaced.
friendly.return.end.title=A return is missing at the end of this method
friendly.return.end=The method promises a value, but on some path through it nothing is returned. Make sure every path ends with return and a value.
friendly.unreachable.title=This line can never run
friendly.unreachable=The code before it always leaves (return, break or throw). Move or remove the line.
friendly.not.statement.title=This is not a complete instruction
friendly.not.statement=Java cannot do anything with this line on its own. Often a ; is missing in the line above, or a value is neither stored nor used.
friendly.method.in.method.title=A method cannot be inside another method
friendly.method.in.method=Close the method above with } before you start a new one.
friendly.expression.title=Java cannot read this expression
friendly.statement.outside.title=This code must be inside a method
friendly.statement.outside=Instructions like method calls belong in a method, for example run() or the constructor. Only declarations (fields and methods) stand directly in the class.
friendly.file.name.title=The class {0} must be in the file {1}
friendly.file.name=A public class and its file need exactly the same name, including capital letters. Rename the class or the file.
friendly.abstract.missing.title={0} is missing the method {1} from {2}
friendly.abstract.missing=Add the method with exactly this name and these parameters, or make {0} abstract.
friendly.abstract.title=You cannot create objects of {0} directly
friendly.abstract={0} is abstract: it is a template for other classes. Create an object of a class that extends it.
friendly.exception.title={0} must be handled here
friendly.exception=This call can fail with {0}. Put it into try { ... } catch ({0} e) { ... }, or add throws {0} to the method.
lint.callback.name={0}() is never called. Did you mean {1}()?
lint.callback.name.explain=The library only calls its methods by their exact names, for example run() every frame or whenClicked() after a click. Rename the method. Tip: write @Override above it, then Java checks the name for you.
lint.callback.params={0}({1}) is never called. The library calls {0}({2}).
lint.callback.params.explain=The library calls {0} only with exactly these parameter types. Older examples sometimes use other types (for example int instead of KeyCode). Change the parameters. Tip: write @Override above it, then Java checks them for you.
lint.callback.other={0}() is never called in a {1}.
lint.callback.other.explain=The library calls {0}() only for a {2}. Move the code into a {2} class, or use a method a {1} has, for example run().
