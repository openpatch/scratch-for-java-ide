friendly.expected.title=Hier fehlt {0}
friendly.expected=Java hat die L\u00fccke an dieser Stelle bemerkt. Wenn du sie hier nicht siehst, schau ans Ende der Zeile dar\u00fcber: Dort fehlt es oft.
friendly.expected.name.title=Hier fehlt ein Name
friendly.expected.name=Java hat hier den Namen einer Variablen, Methode oder Klasse erwartet. Oft steht eine Anweisung wie ein Methodenaufruf au\u00dferhalb einer Methode, oder vor einem Namen fehlt der Typ.
friendly.eof.title=Die Datei endet zu fr\u00fch: Eine schlie\u00dfende geschweifte Klammer } fehlt
friendly.eof=Zu jeder { geh\u00f6rt eine passende }. Pr\u00fcfe, ob jede Methode und die Klasse selbst geschlossen sind.
friendly.outside.class.title=Dieser Code steht au\u00dferhalb der Klasse
friendly.outside.class=Alles muss innerhalb der geschweiften Klammern der Klasse stehen. Oft steht \u00fcber dieser Zeile eine } zu viel, sodass die Klasse zu fr\u00fch endet.
friendly.unknown.variable.title=Java kennt keine Variable namens {0}
friendly.unknown.variable=Pr\u00fcfe die Schreibweise (Java unterscheidet Gro\u00df- und Kleinschreibung!) und ob die Variable vor dieser Zeile deklariert ist, im selben { }-Block oder als Attribut der Klasse.
friendly.unknown.method.title=Java kennt keine Methode namens {0}()
friendly.unknown.method=Pr\u00fcfe die Schreibweise (Java unterscheidet Gro\u00df- und Kleinschreibung!) und ob die Methode zu diesem Objekt geh\u00f6rt. Die API-Hilfe zeigt die Methoden der Bibliothek.
friendly.unknown.class.title=Java kennt keine Klasse namens {0}
friendly.unknown.class=Pr\u00fcfe die Schreibweise: Klassennamen beginnen mit einem Gro\u00dfbuchstaben (String, Sprite). Ist es eine Klasse deines Projekts, muss ihre Datei {0}.java hei\u00dfen.
friendly.import.title={0} braucht einen Import
friendly.import=Schreib diese Zeile ganz oben in die Datei: {1}
friendly.static.title={0} geh\u00f6rt zu einem Objekt, aber dieser Code ist static
friendly.static=Eine static-Methode (wie main) l\u00e4uft ohne Objekt und kann darum keine Attribute und Methoden eines Objekts benutzen. Erzeuge ein Objekt mit new und benutze es, oder schreib den Code in eine Methode, die nicht static ist.
friendly.static.this.title=In einer static-Methode gibt es kein "this"
friendly.static.this=Eine static-Methode (wie main) l\u00e4uft ohne Objekt. Erzeuge ein Objekt mit new und benutze stattdessen dieses.
friendly.constructor.title=Soll {0} der Konstruktor sein? Er muss genau {1} hei\u00dfen
friendly.constructor=Ein Konstruktor hat keinen R\u00fcckgabetyp und genau den Namen seiner Klasse, auch bei Gro\u00df- und Kleinschreibung.
friendly.return.type.title=Die Methode {0} hat keinen R\u00fcckgabetyp
friendly.return.type=Schreib den Typ des Ergebnisses vor den Namen, oder void, wenn die Methode nichts zur\u00fcckgibt: public void {0}()
friendly.override.title={0}() ersetzt keine Methode der Oberklasse
friendly.override=@Override passt nur zu Methoden, die es in der Oberklasse (zum Beispiel Sprite oder Stage) schon gibt, mit genau demselben Namen und denselben Parametern. Pr\u00fcfe Schreibweise und Gro\u00dfbuchstaben: run() ist nicht Run().
friendly.operator.title={0} funktioniert nicht mit {1} und {2}
friendly.operator=Beide Seiten von {0} m\u00fcssen zusammenpassen, zum Beispiel zwei Zahlen. Pr\u00fcfe, welchen Typ die Werte auf beiden Seiten haben.
friendly.operator.text.title={0} funktioniert nicht mit {1} und {2}
friendly.operator.text=Mit Text (String) kann man nicht rechnen und ihn nicht mit < und > vergleichen. Texte vergleichst du mit equals, zum Beispiel name.equals("Bob"). Eine Zahl, die als Text vorliegt, wandelst du zuerst um: Integer.parseInt(text).
friendly.return.void.title=Diese Methode ist void und kann keinen Wert zur\u00fcckgeben
friendly.return.void=Entferne den Wert hinter return, oder ersetze void durch den Typ des Werts, zum Beispiel public int anzahl().
friendly.return.missing.title=Diese Methode muss einen Wert zur\u00fcckgeben
friendly.return.missing=Schreib den Wert hinter return, zum Beispiel return punkte;
friendly.lossy.title={0} passt nicht ohne Verlust in {1}
friendly.lossy=Aus 2.7 w\u00fcrde zum Beispiel 2. Mach die Variable zu einem {0}, oder wandle bewusst um, indem du ({1}) vor den Wert schreibst, zum Beispiel ({1}) getX().
friendly.condition.title=Eine Bedingung braucht true oder false, das hier ist aber {0}
friendly.condition=if und while brauchen eine Ja-Nein-Frage, zum Beispiel x > 0 oder name.equals("Bob").
friendly.assign.condition.title== speichert einen Wert. Zum Vergleichen schreibst du ==
friendly.assign.condition=In einer Bedingung versucht x = 2, die 2 in x zu speichern. Zahlen vergleichst du mit x == 2, Texte mit a.equals(b).
friendly.convert.text.title=Text kann nicht als {0} benutzt werden
friendly.convert.text=Auch "42" ist Text und keine Zahl. Wandle ihn um: Integer.parseInt(text) oder Double.parseDouble(text).
friendly.convert.title={0} passt nicht dorthin, wo {1} gebraucht wird
friendly.convert=Pr\u00fcfe den Typ der Variablen oder des Parameters und was der Ausdruck liefert.
friendly.deref.title={0} ist ein einfacher Wert und hat keine Methoden
friendly.deref=Nur Objekte haben Methoden, die man mit einem Punkt aufruft. int, double, boolean und char sind einfache Werte. Eine Zahl wird mit String.valueOf(x) zu Text.
friendly.private.title={0} ist private in {1}
friendly.private=Nur Code innerhalb von {1} darf es benutzen. Benutze eine public-Methode von {1}, oder mach es public, wenn andere Klassen es benutzen sollen.
friendly.final.title={0} ist final und kann sich nicht \u00e4ndern
friendly.final=Entferne final dort, wo {0} deklariert ist, wenn sich der Wert \u00e4ndern soll.
friendly.defined.title={0} gibt es hier schon
friendly.defined=Zwei Variablen oder Methoden an derselben Stelle k\u00f6nnen nicht gleich hei\u00dfen. Benenne eine um. Um eine vorhandene Variable zu \u00e4ndern, lass den Typ weg: x = 5; statt int x = 5;
friendly.uninitialized.title={0} hat noch keinen Wert
friendly.uninitialized=Gib ihr dort, wo du sie deklarierst, einen Startwert, zum Beispiel int {0} = 0;
friendly.arguments.title={0} braucht ({1}), bekommt aber ({2})
friendly.arguments=Pr\u00fcfe Anzahl, Reihenfolge und Typen der Werte in den Klammern.
friendly.arguments.none=nichts
friendly.arguments.any.title=Keine Version dieser Methode passt zu diesen Werten
friendly.arguments.any=Pr\u00fcfe Anzahl, Reihenfolge und Typen der Werte in den Klammern. Die API-Hilfe zeigt alle Versionen.
friendly.unclosed.string.title=Diesem Text fehlt das schlie\u00dfende "
friendly.unclosed.string=Ein Text beginnt und endet mit einem geraden Anf\u00fchrungszeichen ". Er kann nicht in der n\u00e4chsten Zeile weitergehen.
friendly.unclosed.comment.title=Dieser Kommentar endet nie: */ fehlt
friendly.unclosed.comment=Ein Kommentar, der mit /* beginnt, endet mit */. Alles dazwischen wird ignoriert, Java sieht den Rest deines Codes also nicht.
friendly.smart.quotes.title=Java braucht gerade Anf\u00fchrungszeichen "
friendly.smart.quotes=Typografische Anf\u00fchrungszeichen kommen aus Textverarbeitungen oder Webseiten. Tippe sie mit der "-Taste neu.
friendly.illegal.char.title=Das Zeichen {0} geh\u00f6rt nicht in Java-Code
friendly.illegal.char=Entferne es, oder setze es in Anf\u00fchrungszeichen, wenn es zu einem Text geh\u00f6rt.
friendly.break.title=break funktioniert nur in einer Schleife oder einem switch
friendly.break=Um eine Methode fr\u00fcher zu verlassen, benutze return.
friendly.else.title=Zu diesem else gibt es kein passendes if
friendly.else=Meistens steht ein ; direkt hinter if (...), oder die geschweiften Klammern { } um den if-Teil fehlen oder sitzen falsch.
friendly.return.end.title=Am Ende dieser Methode fehlt ein return
friendly.return.end=Die Methode verspricht einen Wert, aber auf einem Weg durch sie wird nichts zur\u00fcckgegeben. Jeder Weg muss mit return und einem Wert enden.
friendly.unreachable.title=Diese Zeile kann nie ausgef\u00fchrt werden
friendly.unreachable=Der Code davor verl\u00e4sst die Methode immer (return, break oder throw). Verschiebe oder entferne die Zeile.
friendly.not.statement.title=Das ist keine vollst\u00e4ndige Anweisung
friendly.not.statement=Mit dieser Zeile allein kann Java nichts anfangen. Oft fehlt ein ; in der Zeile dar\u00fcber, oder ein Wert wird weder gespeichert noch benutzt.
friendly.method.in.method.title=Eine Methode kann nicht in einer anderen Methode stehen
