compiler.err.expected=Hier ist eine Anweisung oder ein Ausdruck unvollst\u00e4ndig. Meistens fehlt ein Semikolon (;), eine schlie\u00dfende Klammer oder eine schlie\u00dfende geschweifte Klammer in dieser oder der Zeile dar\u00fcber.
compiler.err.premature.eof=Das Dateiende wurde erreicht, w\u00e4hrend noch Klammern offen sind. Vermutlich fehlt eine schlie\u00dfende geschweifte Klammer }.
compiler.err.cant.resolve.symbol=Java kennt diesen Namen nicht. Pr\u00fcfe die Schreibweise (Java unterscheidet Gro\u00df- und Kleinschreibung!) und ob Variable, Methode oder Klasse tats\u00e4chlich so deklariert sind.
compiler.err.cant.resolve.location=Java kann diesen Namen an dieser Stelle nicht finden. Pr\u00fcfe die Schreibweise (Gro\u00df-/Kleinschreibung!) und ob Variable oder Klasse deklariert sind, bevor du sie benutzt.
compiler.err.prob.found.req=Dieser Wert hat den falschen Typ. Pr\u00fcfe, welchen Typ die Variable oder der Parameter erwartet und was der Ausdruck wirklich zur\u00fcckgibt.
compiler.err.missing.ret.stmt=Diese Methode verspricht, einen Wert zur\u00fcckzugeben, aber es gibt einen Weg durch die Methode, der nichts zur\u00fcckgibt. Erg\u00e4nze eine return-Anweisung.
compiler.err.unreachable.stmt=Dieser Code kann nie ausgef\u00fchrt werden, weil der Code davor immer abbricht (return, break oder throw). Entferne den unerreichbaren Code.
compiler.err.not.stmt=Diese Zeile ist keine vollst\u00e4ndige Java-Anweisung. Sehr oft fehlt ein Semikolon (;) in der Zeile dar\u00fcber.
compiler.err.illegal.start.of.expr=Java kann diesen Ausdruck nicht lesen. Vermutlich fehlt eine Klammer, ein Anf\u00fchrungszeichen oder ein Semikolon, oder etwas ist nicht geschlossen.
compiler.err.already.defined=Eine Variable mit diesem Namen existiert hier bereits. Gib dieser Variablen einen anderen Namen.
compiler.err.class.public.should.be.in.file=Eine public-Klasse muss in einer Datei mit genau demselben Namen liegen (Gro\u00df-/Kleinschreibung z\u00e4hlt!). Benenne die Datei oder die Klasse so um, dass beide \u00fcbereinstimmen.
compiler.err.cannot.apply.symbol=Keine Methode mit diesem Namen akzeptiert diese Argumente. Pr\u00fcfe die Typen, die Reihenfolge und die Anzahl der Argumente.
compiler.err.abstract.cant.be.instantiated=Von einer abstrakten Klasse kann kein Objekt erzeugt werden. Benutze stattdessen eine konkrete Unterklasse.
compiler.err.does.not.override.abstract=Deine Klasse implementiert nicht alle abstrakten Methoden. Erg\u00e4nze die fehlende(n) Methode(n) oder mache deine Klasse abstrakt.
compiler.err.unreported.exception.need.to.catch=Dieser Aufruf kann eine Ausnahme (Exception) ausl\u00f6sen, die du behandeln musst. Setze ihn in ein try/catch oder erg\u00e4nze die Ausnahme in der Methodensignatur.
compiler.err.cant.apply.symbol=Keine Methode mit diesem Namen akzeptiert diese Argumente. Pr\u00fcfe die Typen, die Reihenfolge und die Anzahl der Argumente.
compiler.err.cant.apply.symbols=Keine Methode mit diesem Namen akzeptiert diese Argumente. Pr\u00fcfe die Typen, die Reihenfolge und die Anzahl der Argumente.
compiler.err.cant.resolve.location.args=Java kennt hier keine Methode mit diesem Namen. Pr\u00fcfe die Schreibweise (Gro\u00df-/Kleinschreibung!) - der Vorschlag "Meintest du" zeigt \u00e4hnliche Namen - und ob die Methode zu diesem Objekt geh\u00f6rt.
compiler.err.cant.resolve.args=Java kennt keine Methode mit diesem Namen. Pr\u00fcfe die Schreibweise (Gro\u00df-/Kleinschreibung!) und sieh dir die Vorschl\u00e4ge an.
compiler.err.var.might.not.have.been.initialized=Diese Variable wird benutzt, bevor sie einen Wert hat. Gib ihr bei der Deklaration einen Startwert, zum Beispiel int punkte = 0;
compiler.err.else.without.if=Zu diesem else gibt es kein passendes if. Meist ist ein ; direkt nach if (...) oder fehlende { } der Grund.
compiler.err.illegal.start.of.type=Hier steht etwas, wo Java eine Deklaration erwartet. Anweisungen wie Methodenaufrufe m\u00fcssen in einer Methode stehen (zum Beispiel in run() oder im Konstruktor).
lint.forever=Diese Schleife endet nie: {0} wird nie fertig und das Programm friert ein.
lint.forever.explain=In Scratch f\u00fchrt der Wiederhole-fortlaufend-Block seine Bl\u00f6cke einmal pro Bild aus. In Scratch for Java ruft die Bibliothek run() schon etwa 60-mal pro Sekunde auf - schreibe den Schleifeninhalt (ohne Schleife) in run(), dann wiederholt er sich fortlaufend, ohne dass das Fenster einfriert.
lint.longloop=Diese Schleife z\u00e4hlt in jedem Bild bis {0} - das Programm wird ruckeln.
lint.longloop.explain=run() muss schnell fertig werden: Die Bibliothek ruft es etwa 60-mal pro Sekunde auf und zeichnet erst danach. Verteile lange Arbeit auf mehrere Bilder oder erledige sie einmal im Konstruktor.
lint.sleep={0} h\u00e4lt das ganze Programm an, nicht nur diese Figur.
lint.sleep.explain=In Scratch for Java gibt es keinen Warte-Block: Schlafen stoppt das Zeichnen und alle anderen Figuren. Um etwas alle paar Millisekunden zu tun, nutze getTimer().everyMillis(500) in run(); um einmal zu warten, nutze getTimer().forMillis(...) oder z\u00e4hle Bilder.
lint.window.inside={0} erzeugt ein neues Window. Ein Programm hat genau ein Fenster.
lint.window.inside.explain=Die erste Stage, die du erzeugst, \u00f6ffnet das Fenster, und Window gibt es nur einmal. Wechsle B\u00fchnen mit Window.getInstance().setStage(new Level2()) oder transitionToStage(...), statt ein weiteres Fenster zu erzeugen.
lint.window.second=Hier wird ein zweites Fenster erzeugt. Ein Programm hat genau ein Fenster.
lint.window.second.explain=Window gibt es nur einmal: Erzeuge es einmal (oder lass es die erste Stage erzeugen). F\u00fcr eine andere Szene wechselst du die B\u00fchne mit Window.getInstance().setStage(...).
lint.static=Jedes {1}-Objekt hat sein eigenes {0}. Sollen sich alle eins teilen? Dann mach es static.
lint.static.explain=In Scratch ist eine Variable "f\u00fcr alle Figuren" gemeinsam. In Java bekommt jedes Objekt seine eigene Kopie eines Attributs - au\u00dfer es ist static: static int {0} = 0; ist ein Wert, den sich alle {1}-Objekte teilen.
