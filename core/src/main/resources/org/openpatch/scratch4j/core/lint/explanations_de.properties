friendly.exception.title={0} muss hier behandelt werden
friendly.exception=Dieser Aufruf kann mit {0} fehlschlagen. Schreib ihn in try { ... } catch ({0} e) { ... }, oder erg\u00e4nze throws {0} an der Methode.
lint.callback.name={0}() wird nie aufgerufen. Meintest du {1}()?
lint.callback.name.explain=Die Bibliothek ruft ihre Methoden nur unter ihrem genauen Namen auf, zum Beispiel run() in jedem Bild oder whenClicked() nach einem Klick. Benenne die Methode um. Tipp: Schreib @Override dar\u00fcber, dann pr\u00fcft Java den Namen f\u00fcr dich.
lint.callback.params={0}({1}) wird nie aufgerufen. Die Bibliothek ruft {0}({2}) auf.
lint.callback.params.explain=Die Bibliothek ruft {0} nur mit genau diesen Parametertypen auf. \u00c4ltere Beispiele benutzen manchmal andere Typen (zum Beispiel int statt KeyCode). \u00c4ndere die Parameter. Tipp: Schreib @Override dar\u00fcber, dann pr\u00fcft Java sie f\u00fcr dich.
lint.callback.other={0}() wird in einer {1}-Klasse nie aufgerufen.
lint.callback.other.explain=Die Bibliothek ruft {0}() nur in einer {2}-Klasse auf. Verschiebe den Code in eine {2}-Klasse, oder benutze eine Methode, die es in einer {1}-Klasse gibt, zum Beispiel run().
