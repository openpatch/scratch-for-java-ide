friendly.expression.title=Java kann diesen Ausdruck nicht lesen
friendly.statement.outside.title=Dieser Code muss in einer Methode stehen
friendly.statement.outside=Anweisungen wie Methodenaufrufe geh\u00f6ren in eine Methode, zum Beispiel run() oder den Konstruktor. Direkt in der Klasse stehen nur Deklarationen (Attribute und Methoden).
friendly.file.name.title=Die Klasse {0} muss in der Datei {1} stehen
friendly.file.name=Eine public-Klasse und ihre Datei brauchen genau denselben Namen, auch bei Gro\u00df- und Kleinschreibung. Benenne die Klasse oder die Datei um.
friendly.abstract.missing.title={0} fehlt die Methode {1} aus {2}
friendly.abstract.missing=F\u00fcge die Methode mit genau diesem Namen und diesen Parametern hinzu, oder mach {0} abstract.
