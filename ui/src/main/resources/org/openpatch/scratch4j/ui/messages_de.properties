menu.help.guide=Anleitung
guide.title=Scratch for Java Studio - Anleitung
guide.text=1. Start: Neues Projekt legt ein Projekt aus einer Vorlage an; Projekt \u00f6ffnen \u00f6ffnet einen BlueJ-, VS-Code- oder normalen Ordner.\n2. B\u00fchnen (links): jede Stage-Klasse mit Vorschau. Ein Klick \u00f6ffnet den B\u00fchnen-Designer; der Stern markiert die B\u00fchne, die das Programm zuerst zeigt. Das Programm startet in MyWindow, dessen Einstellungen (Vollbild, Pixel-Art, Startbild) du \u00fcber die Fenstereinstellungen \u00e4nderst.\n3. B\u00fchnen-Designer: Figuren ziehen, mit dem runden Griff drehen, mit dem Eckgriff skalieren, Pfeiltasten verschieben, Entf l\u00f6scht, Strg+D dupliziert, Strg+Z macht r\u00fcckg\u00e4ngig. Die Seitenleiste f\u00fcgt Figuren und B\u00fchnenbilder hinzu. Der Designer schreibt normales Java in die markierten Bereiche - der Code bleibt immer ma\u00dfgeblich.\n4. Code: Tabs mit Hervorhebung. Dein Code wird automatisch gespeichert und gepr\u00fcft; Fehler werden unterstrichen - zeige darauf f\u00fcr eine Erkl\u00e4rung, und eine Gl\u00fchbirne am Rand behebt die h\u00e4ufigen mit einem Klick. Strg+Leertaste erg\u00e4nzt (auch Kost\u00fcm- und Klangnamen in addCostume("...")), F1 erkl\u00e4rt die Methode am Cursor, Strg+F sucht. Rechtsklick auf einen Namen springt zur Deklaration, findet Verwendungen oder benennt um (F12, Umschalt+F12, F2).\n5. Bl\u00f6cke (rechts): die Scratch-Bl\u00f6cke, die du kennst, mit ihrem Java. Doppelklick oder Block in den Code ziehen.\n6. Die gr\u00fcne Flagge (F5) startet dein Programm in einem eigenen Fenster; die Konsole zeigt die Ausgabe - klicke auf eine Zeile wie (Player.java:12), um dorthin zu springen. W\u00e4hrend es l\u00e4uft, zeigt die Kopfzeile Pause, Einzelschritt, Tempo, Screenshot und GIF. Weitere Tabs (Variablen, Suche, Debugger, Scratch-Migration) erscheinen unten, sobald dein Projekt sie braucht.\n7. Datei > Zum Projekt hinzuf\u00fcgen legt eine Klasse, ein Bild, einen Klang, einen Ordner, einen Shader oder eine Karte an; Datei > Medienbibliothek hat 841 eingebaute Bilder und 266 Kl\u00e4nge (kenney.nl, CC0). \u00d6ffne eine .png oder .wav im Tab Dateien, um zu malen oder Kl\u00e4nge zu bearbeiten.\n8. Datei > Exportieren (sobald dein Programm einmal lief) erzeugt einen Ordner mit eigenem Java, ein ausf\u00fchrbares JAR oder BlueJ-/VS-Code-Zips. Projekt > Versionen bewahrt jede Version auf, die lief. Hilfe > F\u00fcr Lehrkr\u00e4fte enth\u00e4lt Bibliotheksvariante, Kurspakete und Austauschformate.\n\nTutorials: https://scratch4j.openpatch.org
# --- 2026-10 UI overhaul ---
