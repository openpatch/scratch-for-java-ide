menu.help.guide=User Guide
guide.title=Scratch for Java Studio - User Guide
guide.text=1. Start: New project creates a project from a template; Open project opens a BlueJ, VS Code or plain folder.\n2. Stages (left): every Stage class with a preview. Click one to open the stage designer; the star marks the stage the program shows first. The program starts in MyWindow, whose settings (full screen, pixel art, splash) you change with the window settings button.\n3. Stage designer: drag sprites, turn them with the round handle, resize with the corner handle, arrows nudge, Delete removes, Ctrl+D duplicates, Ctrl+Z undoes. The side panel adds sprites and backdrops. The designer writes plain Java into the marked regions - the code always stays the truth.\n4. Code: tabs with highlighting. Your code is saved and checked automatically; mistakes are underlined - point at them for an explanation, and a light bulb in the margin fixes the common ones with one click. Ctrl+Space completes (also costume and sound names inside addCostume("...")), F1 explains the method under the cursor, Ctrl+F finds. Right-click a name to go to its definition, find its usages or rename it (F12, Shift+F12, F2).\n5. Blocks (right): the Scratch blocks you know, with their Java. Double-click or drag a block into your code.\n6. Green flag (F5) runs your program in its own window; the console shows its output - click a line like (Player.java:12) to jump there. While it runs, the header shows pause, single-step, speed, screenshot and GIF buttons. More tabs (Variables, Search, Debugger, Scratch migration) appear at the bottom when your project needs them.\n7. File > Add to project adds a class, an image, a sound, a folder, a shader or a map; File > Asset Library has 841 built-in images and 266 sounds (kenney.nl, CC0). Open a .png or .wav from the Files tab to paint or edit sounds.\n8. File > Export (once your program has run) makes a folder with its own Java, a runnable JAR, or BlueJ/VS Code zips. Project > Versions keeps every version that ran. Help > For teachers holds the library flavour, course packs and exchange formats.\n\nTutorials: https://scratch4j.openpatch.org
# --- 2026-10 UI overhaul ---
